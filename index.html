<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紡織紗織與機台規格對照系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <link href="./textile-spec-system_files/css2" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --header-bg: #1e3a8a;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1536px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      padding: 24px 32px;
      border-radius: 12px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.25);
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .header-title p {
      color: #93c5fd;
      font-size: 14px;
      margin-top: 4px;
    }

    .badge-sync {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-sync::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .search-input {
      width: 100%;
      padding-left: 38px;
      padding-right: 12px;
      font-size: 15px;
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--border);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-muted);
    }

    .btn-secondary:hover { background-color: #e2e8f0; }

    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }

    th {
      background-color: var(--header-bg);
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: #334155;
      white-space: nowrap;
    }

    tbody tr:hover { background-color: #f8fafc; }

    .badge-yarn {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    .text-bold { font-weight: 600; color: var(--text-main); }
    .text-muted { color: var(--text-muted); font-size: 13px; }

    .btn-action {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-edit { background-color: #fef3c7; color: #b45309; margin-right: 4px; }
    .btn-edit:hover { background-color: #fde68a; }

    .btn-delete { background-color: #fee2e2; color: #b91c1c; }
    .btn-delete:hover { background-color: #fca5a5; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 999;
      opacity: 0; visibility: hidden;
      transition: all 0.25s ease-in-out;
      padding: 12px;
    }

    .modal-overlay.active { opacity: 1; visibility: visible; }

    .modal-card {
      background: #ffffff;
      width: 100%; max-width: 680px; max-height: 96vh;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .modal-header {
      padding: 14px 20px;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }

    .modal-header h3 { font-size: 17px; font-weight: 700; color: var(--text-main); }

    .btn-close {
      background: transparent; border: none; font-size: 20px;
      color: var(--text-muted); cursor: pointer;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-body { padding: 16px 20px; flex: 1; }
    .modal-footer {
      padding: 12px 20px; border-top: 1px solid var(--border);
      background-color: #f8fafc; display: flex; justify-content: flex-end; gap: 12px;
    }

    .form-grid { display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #334155; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    input, textarea {
      width: 100%; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; color: var(--text-main); font-family: inherit;
    }

    textarea { resize: none; height: 42px; }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-title">
      <h1>紡織規格與機台對照系統</h1>
      <p>即時查詢、建立與管理客戶紗織工程規格數據</p>
    </div>
    <div class="badge-sync">雲端資料庫連線中</div>
  </header>

  <div class="card">
    <div class="table-toolbar">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋日期、客戶、品名、紗種規格、備註...">
      </div>
      <button class="btn btn-primary" onclick="openModalForAdd()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        新增規格資料
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>客戶</th>
            <th>品名</th>
            <th>紗種規格</th>
            <th>成品 幅寬 / 碼重</th>
            <th>機台 (吋/針)</th>
            <th>胚布 幅寬 / 碼重</th>
            <th>紗速</th>
            <th>備註</th>
            <th style="text-align: center;">操作</th>
          </tr>
        </thead>
        <tbody id="dataTable">
          <tr><td colspan="10" class="empty-state">資料載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="formTitle">新增規格資料</h3>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>
    
    <form id="specForm" style="display: flex; flex-direction: column;">
      <div class="modal-body">
        <input type="hidden" id="editRowIndex" value="">
        <div class="form-grid">
          <div class="form-row-3">
            <div class="form-group">
              <label>日期 *</label>
              <input type="date" id="date" required>
            </div>
            <div class="form-group">
              <label>客戶名稱 *</label>
              <input type="text" id="customer" placeholder="客戶名稱" required>
            </div>
            <div class="form-group">
              <label>布種品名 *</label>
              <input type="text" id="productName" placeholder="布種品名" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>紗種規格 *</label>
              <input type="text" id="yarnType" placeholder="例如: 75D/72F Polyester" required>
            </div>
            <div class="form-group">
              <label>紗速 (m/min)</label>
              <input type="text" id="yarnSpeed" placeholder="120">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>成品幅寬 (吋)</label>
              <input type="text" id="width" placeholder="60">
            </div>
            <div class="form-group">
              <label>成品碼重 (g/y)</label>
              <input type="text" id="weight" placeholder="200">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>機台吋數 (吋)</label>
              <input type="text" id="machineInch" placeholder="30">
            </div>
            <div class="form-group">
              <label>機台針數 (G)</label>
              <input type="text" id="machineGauge" placeholder="24">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>胚布幅寬 (吋)</label>
              <input type="text" id="greigeWidth" placeholder="65">
            </div>
            <div class="form-group">
              <label>胚布碼重 (g/y)</label>
              <input type="text" id="greigeWeight" placeholder="220">
            </div>
          </div>

          <div class="form-group">
            <label>備註說明</label>
            <textarea id="note" placeholder="可輸入加工注意事項、特殊拉力需求等..."></textarea>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" id="submitBtn" class="btn btn-primary">儲存資料</button>
      </div>
    </form>
  </div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK8w-sZGVSjlVcMYumvJm1YU1y8PO_JVzpQ2Y89b6bedvZPfQgs9Wwt9umsxKt9FO1/exec";

  let dbData = [];

  function getTodayString() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  async function loadData() {
    try {
      const fetchUrl = `${GOOGLE_SCRIPT_URL}?t=${new Date().getTime()}`;
      const res = await fetch(fetchUrl, { cache: "no-store" });
      dbData = await res.json();
      
      const sortedData = sortDataByKeyAndDate(dbData);
      renderTable(sortedData);
    } catch (err) {
      console.error("載入失敗:", err);
      document.getElementById("dataTable").innerHTML = `<tr><td colspan="10" class="empty-state">資料載入失敗，請檢查網路連線或 Apps Script 權限。</td></tr>`;
    }
  }

  function sortDataByKeyAndDate(dataList) {
    return [...dataList].sort((a, b) => {
      const keyA = `${a.customer}_${a.productName}_${a.yarnType}_${a.width}_${a.weight}`.toLowerCase();
      const keyB = `${b.customer}_${b.productName}_${b.yarnType}_${b.width}_${b.weight}`.toLowerCase();

      if (keyA === keyB) {
        const dateA = new Date(a.date || '1970-01-01');
        const dateB = new Date(b.date || '1970-01-01');
        return dateB - dateA;
      }
      
      return keyA.localeCompare(keyB);
    });
  }

  function renderTable(data) {
    const tbody = document.getElementById("dataTable");
    
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" class="empty-state">查無對應的數據資料</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(item => `
      <tr>
        <td class="text-muted">${item.date || '-'}</td>
        <td class="text-bold">${item.customer || ''}</td>
        <td>${item.productName || ''}</td>
        <td><span class="badge-yarn">${item.yarnType || ''}</span></td>
        <td>${item.width || '-'}" <span class="text-muted">/ ${item.weight || '-'}g</span></td>
        <td>${item.machineInch || '-'}" <span class="text-muted">/ ${item.machineGauge || '-'}G</span></td>
        <td>${item.greigeWidth || '-'}" <span class="text-muted">/ ${item.greigeWeight || '-'}g</span></td>
        <td>${item.yarnSpeed ? item.yarnSpeed + ' m/min' : '-'}</td>
        <td>${item.note || '-'}</td>
        <td style="text-align: center;">
          <button class="btn-action btn-edit" onclick="startEdit(${item.rowIndex})">編輯</button>
          <button class="btn-action btn-delete" onclick="deleteItem(${item.rowIndex})">刪除</button>
        </td>
      </tr>
    `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    const keyword = e.target.value.toLowerCase();
    const filtered = dbData.filter(item => 
      Object.values(item).some(val => String(val).toLowerCase().includes(keyword))
    );
    renderTable(sortDataByKeyAndDate(filtered));
  });

  // 新增資料時專用：設為當天日期並開啟彈窗
  function openModalForAdd() {
    resetForm();
    document.getElementById("date").value = getTodayString();
    document.getElementById("modalOverlay").classList.add("active");
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("active");
    resetForm();
  }

  function handleOverlayClick(e) {
    if (e.target.id === "modalOverlay") closeModal();
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  function resetForm() {
    document.getElementById("editRowIndex").value = "";
    document.getElementById("specForm").reset();
    document.getElementById("formTitle").innerText = "新增規格資料";
    document.getElementById("submitBtn").innerText = "儲存資料";
  }

  // 編輯資料：精確帶入該筆資料舊有的日期
  function startEdit(rowIndex) {
    const item = dbData.find(d => d.rowIndex === rowIndex);
    if (!item) return;

    resetForm();

    document.getElementById("editRowIndex").value = item.rowIndex;
    document.getElementById("date").value = item.date || "";
    document.getElementById("customer").value = item.customer || "";
    document.getElementById("productName").value = item.productName || "";
    document.getElementById("yarnType").value = item.yarnType || "";
    document.getElementById("width").value = item.width || "";
    document.getElementById("weight").value = item.weight || "";
    document.getElementById("machineInch").value = item.machineInch || "";
    document.getElementById("machineGauge").value = item.machineGauge || "";
    document.getElementById("greigeWidth").value = item.greigeWidth || "";
    document.getElementById("greigeWeight").value = item.greigeWeight || "";
    document.getElementById("yarnSpeed").value = item.yarnSpeed || "";
    document.getElementById("note").value = item.note || "";

    document.getElementById("formTitle").innerText = "編輯數據 (第 " + rowIndex + " 列)";
    document.getElementById("submitBtn").innerText = "更新數據";
    
    document.getElementById("modalOverlay").classList.add("active");
  }

  document.getElementById("specForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const editRowIndex = document.getElementById("editRowIndex").value;
    const action = editRowIndex ? "update" : "create";

    const formData = {
      action: action,
      rowIndex: editRowIndex,
      date: document.getElementById("date").value,
      customer: document.getElementById("customer").value,
      productName: document.getElementById("productName").value,
      yarnType: document.getElementById("yarnType").value,
      width: document.getElementById("width").value,
      weight: document.getElementById("weight").value,
      machineInch: document.getElementById("machineInch").value,
      machineGauge: document.getElementById("machineGauge").value,
      greigeWidth: document.getElementById("greigeWidth").value,
      greigeWeight: document.getElementById("greigeWeight").value,
      yarnSpeed: document.getElementById("yarnSpeed").value,
      note: document.getElementById("note").value
    };

    closeModal();

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(formData)
      });
      
      alert(action === "update" ? "更新成功！" : "新增成功！");
      loadData();
    } catch (err) {
      console.error("儲存失敗:", err);
      alert("儲存失敗，請稍後再試。");
    }
  });

  async function deleteItem(rowIndex) {
    if (!confirm("確定要刪除這筆數據嗎？")) return;

    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
      });
      alert("已刪除該筆資料！");
      loadData();
    } catch (err) {
      console.error("刪除失敗:", err);
      alert("刪除失敗，請稍後再試。");
    }
  }

  loadData();
</script>

</body>
</html>
